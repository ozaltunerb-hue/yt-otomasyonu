# Birim testleri (API çağrısı yok). Railway "Wait for CI" ile bağlı: main'e push'ta bu iş
# başarısız olursa Railway deploy etmez (TUR 22). Gerçek anahtar/secret gerekmez.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # 12 Kas 2026: apt yerine hazır action (GitHub makinesi Ubuntu paket sunucularına ulaşamıyordu, apt-get takıldı,
      # 6e65e0f ve b145189 deploy'ları SKIPPED). ffmpeg gerektiren testler ffmpeg yoksa atlanır (skipUnless)
      - name: ffmpeg (hareket profili testi)
        timeout-minutes: 8
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
      - run: pip install -r requirements.txt
      - name: unittest
        env:
          KIE_API_KEY: ci-dummy
          OPENAI_API_KEY: sk-ci-dummy
          NOTION_SOCIAL_TOKEN: ci-dummy
          NOTION_DB_YOUTUBE_OTOMASYON: ci-dummy
        run: python -m unittest discover -s tests
